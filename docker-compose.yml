version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adlens
      POSTGRES_PASSWORD: adlens_pk_2024
      POSTGRES_DB: adlens_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - META_API_TOKEN=${META_API_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - USE_MOCK_DATA=False
      - DATABASE_URL=postgresql://adlens:adlens_pk_2024@db:5432/adlens_db
    ports:
      - "8501:8501"
    expose:
      - "8501"

volumes:
  postgres_data:
